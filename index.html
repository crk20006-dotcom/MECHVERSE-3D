<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MECHVERSE 3D</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a1120;color:#e5edf9;font:15px system-ui}header{padding:20px 5%;border-bottom:1px solid #26364d;display:flex;justify-content:space-between;align-items:center}strong{color:#71e3cc}main{max-width:1440px;margin:auto;padding:24px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px}aside,section{background:#111c2e;border:1px solid #293b53;border-radius:16px;padding:18px}h1,h2,h3,p{margin:0 0 12px}small, .muted{color:#a5b7ce}button,input,select,textarea{font:inherit}button,select,input[type=search],textarea{background:#1b2b40;color:#edf5ff;border:1px solid #354b66;border-radius:8px;padding:10px}button{cursor:pointer}button:hover,button.active{background:#245c67;border-color:#71e3cc}input[type=search],textarea{width:100%}nav button{display:block;width:100%;text-align:left;margin:5px 0}nav h4{color:#8eacc9;margin:18px 0 5px}.workspace{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(230px,1fr);gap:16px}.metrics{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.metric{background:#182a40;padding:12px;border-radius:9px;flex:1;min-width:130px}.metric b{display:block;font-size:23px;color:#71e3cc}canvas{display:block;width:100%;background:#0a1425;border-radius:10px}#view{height:350px;touch-action:none;cursor:grab}#graph{height:240px;pointer-events:none;touch-action:pan-y}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}label{display:block;margin:12px 0}label output{float:right;color:#71e3cc}input[type=range]{width:100%;accent-color:#71e3cc}.lower{margin-top:16px}#report{white-space:pre-wrap} @media(max-width:850px){main,.workspace{grid-template-columns:1fr}main{padding:12px}nav{max-height:240px;overflow:auto}#view{height:300px}}@media print{body{background:white;color:black}header,aside,.bar,.controls,#search{display:none}main,.workspace{display:block}section{background:white;border:0} .metric{background:white;color:black}.metric b{color:black}.muted,small{color:#333}}
</style><header><div><strong>MECHVERSE / 3D</strong><div class="muted">Engineering simulation studio</div></div><small>OFFLINE LAB · NO API REQUIRED</small></header><main><aside><h2>Experiment library</h2><input id="search" type="search" placeholder="Search experiments" aria-label="Search experiments"><nav id="nav"></nav></aside><article><h1 id="title"></h1><p id="desc" class="muted"></p><div class="workspace"><section><h3>3D workspace</h3><canvas id="view" aria-label="Rotatable mechanical model"></canvas><div class="bar"><button id="play">Pause</button><button id="resetcam">Reset camera</button><button id="zin">Zoom +</button><button id="zout">Zoom −</button><button id="snap">Model PNG</button></div><small>Drag to orbit. Use zoom buttons. Geometry is an educational schematic.</small></section><section class="controls"><h3>Experiment controls</h3><div id="controls"></div><button id="reset">Reset parameters</button></section></div><div id="metrics" class="metrics"></div><section><h3 id="graphTitle">Results graph</h3><small>🔒 Locked graph · touch scrolls the page, not the graph</small><canvas id="graph" width="900" height="300"></canvas><div class="bar"><button id="png">Download graph PNG</button><button id="csv">Download CSV</button><button id="record">Record reading</button></div><div id="readings"></div></section><section class="lower"><h3>Guided tutor</h3><p id="formula"></p><p id="guide"></p><button id="quiz">Check understanding</button><p id="question"></p><button id="reveal" hidden>Reveal answer</button><p id="solution"></p><h3>Lab journal</h3><textarea id="notes" placeholder="Write observations and conclusions"></textarea><div class="bar"><button id="reportBtn">Download report HTML</button><button onclick="window.print()">Print / Save PDF</button></div></section></article></main><script src="labs.js"></script><script src="app.js"></script></html>
